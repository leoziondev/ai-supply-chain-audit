    <path d="M111 93c9 9 9 23 0 32l-5 5c-9 9-23 9-32 0" fill="none" stroke="#94A3B8" stroke-width="9" stroke-linecap="round"/>
    <path d="M71 108 105 74" fill="none" stroke="#2DD4BF" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g transform="translate(318 174)">
