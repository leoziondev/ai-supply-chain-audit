<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Supply Chain Security Audit Prompt Toolkit</title>
  <desc id="desc">GitHub banner for an AppSec toolkit focused on supply chain, CI/CD, frameworks, SaaS and data breach response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="152" y1="120" x2="1090" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1090" cy="130" r="180" fill="#0EA5E9" opacity="0.12" filter="url(#soft)"/>
  <circle cx="190" cy="560" r="220" fill="#14B8A6" opacity="0.10" filter="url(#soft)"/>
  <g opacity="0.20" stroke="#94A3B8" stroke-width="1">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280"/>
    <path d="M160 0v640M320 0v640M480 0v640M640 0v640M800 0v640M960 0v640M1120 0v640"/>
  </g>
  <g transform="translate(92 156)">
    <rect width="176" height="176" rx="38" fill="#0B1220" stroke="url(#accent)" stroke-width="6"/>
    <path d="M88 24 138 43v39c0 36-20 60-50 76-30-16-50-40-50-76V43l50-19Z" fill="#111827" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/>
