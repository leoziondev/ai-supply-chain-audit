    <text x="0" y="70" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750">Audit Prompt Toolkit</text>
    <text x="0" y="130" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Prompts, checklists, templates and agent adapters for evidence-first AppSec audits.</text>
    <g transform="translate(0 172)" fill="none" stroke-width="2">
      <rect width="156" height="38" rx="19" stroke="#2DD4BF"/>
      <text x="22" y="25" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">audit-only</text>
      <rect x="174" width="158" height="38" rx="19" stroke="#38BDF8"/>
      <text x="196" y="25" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">agent-ready</text>
      <rect x="350" width="160" height="38" rx="19" stroke="#A78BFA"/>
